<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Keeping up to speed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --bg-elev: #121212;
      --bg-card: #181818;
      --text: #FFFFFF;
      --text-2: #B3B3B3;
      --text-3: #7A7A7A;
      --accent: #A855F7;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    .backdrop {
      position: fixed;
      inset: 0 auto auto 0;
      width: 100%;
      height: 55vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .backdrop img {
      width: 140%;
      height: 140%;
      margin: -20%;
      object-fit: cover;
      filter: blur(80px) saturate(1.3);
      opacity: 0.55;
    }
    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(18,18,18,0.72) 58%, #000 100%);
    }
    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: calc(20px + var(--safe-top)) 20px calc(40px + var(--safe-bot));
    }
    header.show {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 8px 4px 28px;
    }
    header.show img.mark {
      width: 96px;
      height: 96px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
      margin-bottom: 18px;
      background: #0B1020;
    }
    header.show h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    header.show p {
      margin: 8px 0 0;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-2);
    }
    .count {
      margin: 0 4px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .list { display: flex; flex-direction: column; gap: 8px; }
    a.ep {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
      background: var(--bg-card);
      border-radius: 14px;
      padding: 12px;
      min-height: 96px;
    }
    a.ep:active { background: #222; }
    a.ep img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      flex: 0 0 72px;
      background: #0B1020;
    }
    a.ep .meta { flex: 1; min-width: 0; }
    a.ep h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    a.ep p {
      margin: 6px 0 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
    }
    a.ep .chev {
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      color: var(--text-3);
    }
    .empty, .err {
      color: var(--text-2);
      font-size: 15px;
      padding: 16px 4px;
    }
    @media (min-width: 720px) {
      header.show h1 { font-size: 36px; }
      a.ep { padding: 14px; }
      a.ep img { width: 88px; height: 88px; flex-basis: 88px; border-radius: 10px; }
      a.ep h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><img id="glow" alt="" /></div>
  <div class="app">
    <header class="show">
      <img class="mark" id="mark" alt="" />
      <h1>Keeping up to speed</h1>
      <p id="tagline">A weekly briefing from the lanes</p>
    </header>
    <div class="count" id="count"></div>
    <div class="list" id="list">
      <p class="empty">Loading episodes…</p>
    </div>
  </div>
  <script>
  (function () {
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const tagline = document.getElementById("tagline");
    const mark = document.getElementById("mark");
    const glow = document.getElementById("glow");

    function render(data) {
      const show = data.show || "Keeping up to speed";
      document.title = show;
      document.querySelector("header.show h1").textContent = show;
      if (data.tagline) tagline.textContent = data.tagline;
      const episodes = (data.episodes || []).slice().sort(function (a, b) {
        return (b.date || "").localeCompare(a.date || "");
      });
      if (!episodes.length) {
        list.innerHTML = '<p class="empty">No episodes yet.</p>';
        return;
      }
      const latest = episodes[0];
      if (latest.cover) {
        mark.src = latest.cover;
        mark.alt = show;
        glow.src = latest.cover;
      }
      count.textContent = episodes.length === 1 ? "1 episode" : episodes.length + " episodes";
      list.innerHTML = "";
      episodes.forEach(function (ep) {
        const a = document.createElement("a");
        a.className = "ep";
        a.href = ep.url;
        const img = document.createElement("img");
        img.src = ep.cover;
        img.alt = "";
        const meta = document.createElement("div");
        meta.className = "meta";
        const h2 = document.createElement("h2");
        h2.textContent = ep.title;
        const p = document.createElement("p");
        p.textContent = [ep.date_label || ep.date, ep.duration_label].filter(Boolean).join(" · ");
        meta.appendChild(h2);
        meta.appendChild(p);
        a.appendChild(img);
        a.appendChild(meta);
        a.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>');
        list.appendChild(a);
      });
    }

    fetch("episodes.json", { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("Could not load episodes");
        return r.json();
      })
      .then(render)
      .catch(function () {
        list.innerHTML = '<p class="err">Couldn’t load the episode list.</p>';
      });
  })();
  </script>
</body>
</html>
